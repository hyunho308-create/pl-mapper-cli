<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
  <title id="title">Hotel P&amp;L Mapper workflow</title>
  <desc id="description">A source hotel profit and loss workbook is ingested once, explored for valid reporting periods, paused for the user's choice, mapped to the Standard COA, validated, and written as a new workbook with summary and audit files.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27313a"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #27313a; stroke-width: 3; rx: 8; }
      .line { fill: none; stroke: #27313a; stroke-width: 3; marker-end: url(#arrow); }
      .title { fill: #27313a; font: 42px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .heading { fill: #27313a; font: 30px Calibri, "Segoe UI", Arial, sans-serif; font-weight: 600; text-anchor: middle; }
      .label { fill: #27313a; font: 23px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .small { fill: #5e6871; font: 20px Calibri, "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .step { fill: #ffffff; stroke: #27313a; stroke-width: 2; }
      .step-text { fill: #27313a; font: 21px Calibri, "Segoe UI", Arial, sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="page" width="1500" height="760"/>
  <text class="title" x="750" y="62">Operator P&amp;L to Standard COA</text>

  <!-- Row 1: source, exploration, and the user checkpoint. -->
  <rect class="box" x="55" y="110" width="420" height="250"/>
  <circle class="step" cx="82" cy="140" r="18"/>
  <text class="step-text" x="82" y="141">1</text>
  <text class="heading" x="265" y="195">Source workbook</text>
  <text class="label" x="265" y="245">One complete hotel P&amp;L</text>
  <text class="small" x="265" y="295">Parsed once</text>
  <text class="small" x="265" y="325">Source preserved</text>

  <rect class="box" x="540" y="110" width="420" height="250"/>
  <circle class="step" cx="567" cy="140" r="18"/>
  <text class="step-text" x="567" y="141">2</text>
  <text class="heading" x="750" y="195">Explore &amp; discover</text>
  <text class="label" x="750" y="245">Identify useful sheets, layout,</text>
  <text class="label" x="750" y="280">and validated reporting periods</text>

  <rect class="box" x="1025" y="110" width="420" height="250"/>
  <circle class="step" cx="1052" cy="140" r="18"/>
  <text class="step-text" x="1052" y="141">3</text>
  <text class="heading" x="1235" y="195">User checkpoint</text>
  <text class="label" x="1235" y="245">Codex shows available periods</text>
  <text class="label" x="1235" y="280">and waits for your choice</text>
  <text class="small" x="1235" y="325">The same run resumes afterward</text>

  <path class="line" d="M475 235 H530"/>
  <path class="line" d="M960 235 H1015"/>
  <path class="line" d="M1235 360 V395 H265 V420"/>

  <!-- Row 2 continues left to right. -->
  <rect class="box" x="55" y="430" width="420" height="250"/>
  <circle class="step" cx="82" cy="460" r="18"/>
  <text class="step-text" x="82" y="461">4</text>
  <text class="heading" x="265" y="515">Bind &amp; map</text>
  <text class="label" x="265" y="555">Tie chosen columns to periods</text>
  <text class="label" x="265" y="590">and map rows to the 271-account COA</text>
  <text class="small" x="265" y="635">Luna reasons • Python reads values</text>

  <rect class="box" x="540" y="430" width="420" height="250"/>
  <circle class="step" cx="567" cy="460" r="18"/>
  <text class="step-text" x="567" y="461">5</text>
  <text class="heading" x="750" y="515">Validate &amp; reconcile</text>
  <text class="label" x="750" y="555">Check values, rollups, coverage,</text>
  <text class="label" x="750" y="590">consistency, and source discrepancies</text>
  <text class="small" x="750" y="635">Flag exceptions for human review</text>

  <rect class="box" x="1025" y="430" width="420" height="250"/>
  <circle class="step" cx="1052" cy="460" r="18"/>
  <text class="step-text" x="1052" y="461">6</text>
  <text class="heading" x="1235" y="515">Reviewable outputs</text>
  <text class="label" x="1235" y="550">New [MAPPED].xlsx workbook</text>
  <text class="label" x="1235" y="585">summary.json • run_log.json</text>
  <text class="label" x="1235" y="620">work/ diagnostics and model traces</text>
  <text class="small" x="1235" y="655">Source workbook remains unchanged</text>

  <path class="line" d="M475 555 H530"/>
  <path class="line" d="M960 555 H1015"/>
</svg>
