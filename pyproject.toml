[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-pl-normalizer"
version = "2.0.0"
description = "Normalize hotel P&L workbooks into the Standard COA from the command line."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "xlrd>=2.0",
]

[project.scripts]
hotel-pl-normalizer = "hotel_pl_normalizer.cli:main"

[tool.setuptools.packages.find]
include = ["hotel_pl_normalizer*"]

[tool.setuptools.package-data]
"hotel_pl_normalizer.prompts" = ["*.md"]
"hotel_pl_normalizer.data" = ["*.csv", "*.xlsx"]
